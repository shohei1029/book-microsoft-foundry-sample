# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: onboarding-agent-v2
services:
  onboarding-agent-v2:
    host: azure.ai.agent
    kind: hosted
    name: onboarding-agent-v2
    description: 検索根拠を共有し、構造化レビューから差し戻す v2
    project: .
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: src/main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: gpt-6-luna
      - name: AZURE_SEARCH_ENDPOINT
        value: https://srch-foundry-book.search.windows.net
      - name: FOUNDRY_IQ_KNOWLEDGE_BASE_NAME
        value: onboarding-knowledgebase
      - name: FOUNDRY_IQ_KNOWLEDGE_SOURCE_NAME
        value: onbording-knowledgesource
      - name: MAX_REVISIONS
        value: '2'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
