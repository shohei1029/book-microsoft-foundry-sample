[project]
name = "on-boarding-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework==1.19.0",
    "agent-framework-foundry==1.11.0",
    "agent-framework-foundry-hosting==1.0.0b260918",
    "aiohttp>=3.0",
    "azure-ai-projects==2.7.0",
    "azure-identity>=1.25.0",
    "azure-search-documents==12.1.0b2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "requests>=2.34.2",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.pytest.ini_options]
markers = [
    "large: integration tests that call running Docker Compose services",
]
