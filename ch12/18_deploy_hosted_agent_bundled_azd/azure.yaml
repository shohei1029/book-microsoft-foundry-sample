# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: hosted-agent-bundled-azd
services:
  hosted-agent-bundled-azd:
    host: azure.ai.agent
    kind: hosted
    name: hosted-agent-bundled-azd
    description: Bundled source-code deployment sample
    project: src
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: bundled
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: gpt-6-luna
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
