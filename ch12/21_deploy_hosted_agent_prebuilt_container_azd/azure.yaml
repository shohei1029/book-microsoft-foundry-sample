# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: hosted-agent-prebuilt-container
services:
  hosted-agent-prebuilt-container:
    host: azure.ai.agent
    kind: hosted
    name: hosted-agent-prebuilt-container
    description: Prebuilt container deployment sample
    project: src
    image: '<container-image>'
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-6-luna
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
